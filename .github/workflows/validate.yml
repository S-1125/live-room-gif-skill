name: 校验技能

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 检查 Python 语法
        run: python -m py_compile skills/live-room-gif/scripts/*.py skills/weather-poster-gif/scripts/*.py

      - name: 检查命令入口
        run: |
          python skills/live-room-gif/scripts/audit_gif.py --help
          python skills/live-room-gif/scripts/extract_gif.py --help
          python skills/live-room-gif/scripts/build_gif.py --help
          python skills/live-room-gif/scripts/contact_sheet.py --help
          python skills/live-room-gif/scripts/marquee_gif.py --help
          python skills/live-room-gif/scripts/sweep_gif.py --help
          python skills/live-room-gif/scripts/breathing_gif.py --help
          python skills/weather-poster-gif/scripts/weather_poster_gif.py --help
